[pytest]
testpaths = tests
# The tests/ directory still contains a handful of ad-hoc runnable scripts that
# execute application code (and call sys.exit()) at import time, which aborts
# collection. They are excluded here rather than for correctness reasons.
#
# Tests that hit third-party APIs (Yahoo Finance, DeepSeek, Brave) skip unless
# KI_NETWORK_TESTS=1 is set, so the default run is fast and hermetic.
addopts =
    --ignore=tests/test_button.py
    --ignore=tests/test_fix.py
    --ignore=tests/test_yahooquery_simple.py
    --ignore=tests/test_analyst_details.py
    --ignore=tests/test_performance.py
    --ignore=tests/test_reset_flow.py
    --ignore=tests/test_security.py
    --ignore=tests/test_validation.py
