[pytest]
testpaths = tests
# The tests/ directory is a mix of real pytest modules and ad-hoc runnable
# scripts. Scripts execute application code (and call sys.exit()) at import
# time, which aborts collection, so they are excluded here.
#
# test_brave_with_context.py / test_tickers.py also import `yfinance`, a package
# the project intentionally replaced with `yahooquery` (see requirements.txt),
# so they cannot even be imported any more.
addopts =
    --ignore=tests/test_button.py
    --ignore=tests/test_fix.py
    --ignore=tests/test_yahooquery_simple.py
    --ignore=tests/test_analyst_details.py
    --ignore=tests/test_performance.py
    --ignore=tests/test_reset_flow.py
    --ignore=tests/test_security.py
    --ignore=tests/test_validation.py
    --ignore=tests/test_brave_with_context.py
    --ignore=tests/test_tickers.py
